<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Меню - Кофейня Зёрна</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="index.html">Зёрна</a>
      <nav aria-label="Главное меню">
        <a href="index.html">Главная</a>
        <a class="active" href="menu.html" aria-current="page">Меню</a>
        <a href="contacts.html">Контакты</a>
      </nav>
    </div>
  </header>
  <main>
    <h1>Наше меню</h1>
    <p class="subtitle">Напитки, которые мы готовим каждый день.</p>
    <section class="gallery" data-gallery aria-label="Напитки">
      <div class="slides">
        <article class="slide visible" data-slide aria-hidden="false">
          <span class="illustration" aria-hidden="true">☕</span>
          <h2>Эспрессо</h2>
          <p>Крепкий кофе с насыщенным вкусом.</p>
          <strong class="price">130 ₽</strong>
        </article>
        <article class="slide" data-slide aria-hidden="true">
          <span class="illustration" aria-hidden="true">🥛</span>
          <h2>Капучино</h2>
          <p>Эспрессо с молоком и воздушной пенкой.</p>
          <strong class="price">190 ₽</strong>
        </article>
        <article class="slide" data-slide aria-hidden="true">
          <span class="illustration" aria-hidden="true">🧋</span>
          <h2>Латте</h2>
          <p>Мягкий кофе с большим количеством молока.</p>
          <strong class="price">220 ₽</strong>
        </article>
      </div>
      <div class="controls">
        <button type="button" data-prev aria-label="Предыдущий напиток">←</button>
        <span class="counter" data-counter>1 / 3</span>
        <button type="button" data-next aria-label="Следующий напиток">→</button>
      </div>
    </section>
  </main>
  <footer>© 2026 Кофейня «Зёрна»</footer>
</body>
</html>
